# Install as /etc/nginx/snippets/finova-proxy.conf.
# These headers overwrite anything the browser supplied.
proxy_set_header Host finova.example.com;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Finova-User $remote_user;
include /etc/finova/proxy-secret.conf;
# HTTP Basic credentials terminate at nginx, never at FINOVA or the AI service.
proxy_set_header Authorization "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Connection "";
proxy_http_version 1.0;
proxy_request_buffering on;
proxy_buffering on;
proxy_connect_timeout 5s;
proxy_send_timeout 20s;
proxy_read_timeout 100s;
proxy_hide_header Server;
proxy_pass http://127.0.0.1:8000;
