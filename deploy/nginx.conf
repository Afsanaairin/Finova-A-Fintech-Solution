# Install under nginx's http context, e.g. /etc/nginx/sites-available/finova.
# Replace EVERY finova.example.com with your real hostname.
limit_req_zone $binary_remote_addr zone=finova_requests:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=finova_ai:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=finova_connections:10m;
# Avoid logging queries, cookies, authorization headers or uploaded content.
log_format finova '$remote_addr [$time_local] $request_method $uri $status';

server {
    listen 80;
    listen [::]:80;
    server_name finova.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/acme;
        limit_except GET { deny all; }
    }
    location / {
        return 308 https://finova.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name finova.example.com;
    ssl_certificate /etc/letsencrypt/live/finova.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finova.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    if ($host != finova.example.com) { return 444; }

    # All pages and APIs require an individual operator credential.
    auth_basic "FINOVA restricted demo";
    auth_basic_user_file /etc/finova/finova.htpasswd;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    access_log /var/log/nginx/finova-access.log finova;
    error_log /var/log/nginx/finova-error.log warn;

    client_max_body_size 8k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 20s;
    limit_conn finova_connections 8;
    limit_conn_status 429;
    limit_req zone=finova_requests burst=20 nodelay;
    limit_req_status 429;

    location = /api/upload {
        # 12 MiB file + 64 KiB multipart allowance; matches server.py.
        client_max_body_size 12648448;
        limit_except POST { deny all; }
        include /etc/nginx/snippets/finova-proxy.conf;
    }
    location ~ ^/api/(ask|cover|akamai-test)$ {
        limit_req zone=finova_requests burst=20 nodelay;
        limit_req zone=finova_ai burst=2 nodelay;
        limit_except GET POST { deny all; }
        include /etc/nginx/snippets/finova-proxy.conf;
    }
    location / {
        limit_except GET POST { deny all; }
        include /etc/nginx/snippets/finova-proxy.conf;
    }
}
